name: Java CI with Maven

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "25"
          cache: maven

      - name: Build with Maven
        working-directory: ./relentless-backend
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/testdb
          DB_USERNAME: testuser
          DB_PASSWORD: testpassword
          JWT_ACCESS_SECRET: ci-dummy-jwt-access-token-secret
          JWT_REFRESH_SECRET: ci-dummy-jwt-refresh-token-secret
          MINIO_URL: http://localhost:9000
          MINIO_ACCESS_KEY: ci-dummy-minio-access-key
          MINIO_SECRET_KEY: ci-dummy-minio-secret-key
          MAIL_HOST: localhost
          MAIL_PORT: 1025
          MAIL_USERNAME: testuser
          MAIL_PASSWORD: testpassword
          STRIPE_SECRET_KEY: ci-dummy-stripe-secret-key
          STRIPE_WEBHOOK_SECRET: ci-dummy-stripe-webhook-secret
          FRONTEND_URL: http://localhost:3000
